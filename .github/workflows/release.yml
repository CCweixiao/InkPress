name: Release

# 触发：
# 1. 推送 v* 形式的 tag（如 v0.1.0）→ 自动构建并发布 Release
# 2. 手动触发（workflow_dispatch）→ 输入 tag 名后构建并发布
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "electron/**"
      - "src/**"
      - "build/**"
      - "public/**"
      - "themes/**"
      - "resources/skills/system/**"
      - "prisma/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "prisma.config.ts"
      - "tsconfig.json"
      - "tsconfig.electron.json"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag 名（必须为 v0.1.0 形式）"
        required: true
        default: "v0.1.0"

# 同一 tag 重新触发时取消旧的运行（避免旧代码构建阻塞新构建）
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

# Apple Silicon 与 Intel 必须分别在原生 runner 构建；本 workflow 只负责 arm64，
# x64 由 release-macos-intel.yml 的 macos-15-intel runner 负责。
jobs:
  build:
    name: Build (arm64)
    runs-on: macos-15
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$RAW_TAG" in
            v*) ;;
            *) echo "✗ 手动发布 tag 必须以 v 开头: $RAW_TAG"; exit 1 ;;
          esac
          VERSION="${RAW_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "✗ tag 版本号非法: $RAW_TAG"
            exit 1
          fi
          TAG="v$VERSION"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "refs/tags/$TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.8.0"
          run_install: false

      - name: Setup Node 22（匹配 better-sqlite3 prebuilt ABI 127）
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # 启用 pnpm store 缓存：首次运行后，依赖装包时间从 ~60s 降到 ~10s
          cache: pnpm

      - name: Assert native arm64 build host
        run: node scripts/verify-electron-package.mjs --phase host --platform darwin --arch arm64

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache Electron, native headers and builder tools
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.electron-gyp
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          # 允许 better-sqlite3 / electron / sharp 等原生包构建
          pnpm_allow_build: "true"

      # 从 tag 名提取版本号写回 package.json，避免 tag 与产物文件名错位。
      # 例如 tag=v0.4.2 → package.json.version=0.4.2 → 产物 InkPress-0.4.2-arm64.dmg。
      # next.config.ts 的 APP_VERSION 注入和 prepare-standalone 均依赖 package.json.version。
      - name: Sync version from tag
        env:
          RAW_TAG: ${{ github.event_name == 'pull_request' && format('0.0.0-pr.{0}', github.event.pull_request.number) || github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/sync-build-version.mjs "$RAW_TAG"

      - name: Configure code signing
        id: sign
        env:
          EVENT_NAME: ${{ github.event_name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          ANY_CONFIGURED=false
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              ANY_CONFIGURED=true
            else
              MISSING="$MISSING $name"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "代码签名 secrets 已配置，将签名 + 公证"
          elif [ "$EVENT_NAME" != "pull_request" ] || [ "$ANY_CONFIGURED" = "true" ]; then
            echo "✗ 正式发布必须完整签名和公证；缺少:$MISSING"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PR 未配置签名 secrets，使用显式未签名构建做安装流程验证"
            # 同时关闭 notarize，避免无凭据构建触发网络探测或产生“签名但未公证”歧义。
            node -e "const fs=require('fs'),p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.build.mac.identity=null;j.build.mac.notarize=false;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          fi

      - name: Build, verify and install-smoke DMG (arm64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INKPRESS_REQUIRE_MAC_SIGNATURE: ${{ steps.sign.outputs.enabled }}
        run: pnpm electron:build:arm64

      - name: Upload arm64 DMG directly to draft Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes \
              || gh release view "$TAG" >/dev/null
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" \
            || { echo "✗ $TAG 已公开，拒绝覆盖资产"; exit 1; }
          gh release upload "$TAG" dist/*.dmg --clobber

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # 创建 Release 所需
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # 规范化：确保以 v 开头
          case "$TAG" in
            v*) echo "tag=$TAG" >> "$GITHUB_OUTPUT" ;;
            *)  echo "tag=v$TAG" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish only after all three platform assets exist
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          READY=true
          for FILE in \
            "InkPress-${VERSION}-arm64.dmg" \
            "InkPress-${VERSION}-x64.dmg" \
            "InkPress-${VERSION}-x64.exe"; do
            if ! grep -Fxq "$FILE" <<< "$ASSETS"; then
              echo "等待其他平台资产：$FILE"
              READY=false
            fi
          done
          if [ "$READY" != "true" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --draft=false
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "✓ 三个平台资产齐全，Release 已公开"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version to inkpress-service
        if: steps.finalize.outputs.published == 'true'
        continue-on-error: true
        env:
          RELEASE_REGISTER_TOKEN: ${{ secrets.RELEASE_REGISTER_TOKEN }}
          SYNC_URL: ${{ vars.INKPRESS_SYNC_URL || 'https://www.longoflow.com/api/releases/sync-version' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASE_REGISTER_TOKEN" ]; then
            echo "⚠️ RELEASE_REGISTER_TOKEN 未配置，跳过版本同步"
            exit 0
          fi
          VERSION="${{ steps.tag.outputs.tag }}"
          # 从 GH Release 获取 body（generate_release_notes 生成的内容）
          GH_RELEASE_BODY=$(gh release view "$VERSION" --json body -q .body 2>/dev/null || echo "")
          BODY_JSON=$(jq -Rs . <<< "$GH_RELEASE_BODY")
          echo "同步版本 ${VERSION#v} → $SYNC_URL"
          curl -fsS -X POST "$SYNC_URL" \
            -H "X-Release-Token: $RELEASE_REGISTER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"packageName\":\"inkpress\",\"version\":\"${VERSION#v}\",\"channel\":\"stable\",\"changelogMarkdown\":$BODY_JSON}" \
            && echo "✓ 版本同步成功" \
            || echo "⚠️ 版本同步失败（不阻塞发布）"
