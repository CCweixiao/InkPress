name: Release (Windows)

# 独立的 Windows x64 打包流水线，与 release.yml（mac arm64）互不影响：
# - 同一个 tag（v*）会同时触发两个 workflow，但文件 / concurrency group /
#   Release 资产完全隔离，互不阻塞、互不覆盖
# - Windows 跑挂不影响 mac 发版，反之亦然
# - softprops/action-gh-release 默认 upsert 模式：Release 已存在则 append 资产
#
# 触发：
# 1. 推送 v* 形式的 tag → 自动构建并 append 到对应 Release
# 2. workflow_dispatch → 手动触发（输入 tag 名）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag 名（如 v0.1.0，无需前缀也行）"
        required: true
        default: "v0.1.0"

# 与 release.yml 的 release-${ref_name} group 不同，避免互相 cancel
concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.8.0"
          run_install: false

      - name: Setup Node 22（匹配 better-sqlite3 prebuilt ABI 127）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # 允许 better-sqlite3 / electron / sharp 等原生包构建
          pnpm_allow_build: "true"

      # 从 tag 名提取版本号写回 package.json，避免 tag 与产物文件名错位。
      # 例：tag=v0.4.3 → package.json.version=0.4.3 → 产物 InkPress-0.4.3-x64.exe
      - name: Sync version from tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.tag }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          VERSION="${RAW#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "✗ tag 版本号非法: $RAW（期望 vX.Y.Z）"
            exit 1
          fi
          echo "同步 package.json version → $VERSION（来源: $RAW）"
          node -e "const fs=require('fs'),p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          grep '"version"' package.json

      - name: Prepare Electron build（next build → prepare-standalone → tsc electron）
        run: pnpm electron:prepare

      # Windows 暂未购买 Authenticode 证书，产物未签名。
      # 用户首次打开会被 SmartScreen 警告，点「仍要运行」可过。
      # 后续配置证书后，在此 step 注入 CSC_LINK/CSC_KEY_PASSWORD（Windows 版）
      # 或用 Azure Trusted Signing（electron-builder 已原生支持）。
      - name: Build NSIS installer (x64)
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Append Windows assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # append 资产到已存在的 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          # 规范化：确保以 v 开头
          case "$TAG" in
            v*) echo "tag=$TAG" >> "$GITHUB_OUTPUT" ;;
            *)  echo "tag=v$TAG" >> "$GITHUB_OUTPUT" ;;
          esac

      # append 模式：release.yml 创建的 Release 已存在 → 只追加 .exe 资产，
      # 不改 tag_name / name / body，不覆盖 mac dmg。
      - name: Append Windows assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
